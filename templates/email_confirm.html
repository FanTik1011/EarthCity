<div style="font-family: Inter, Arial, sans-serif; line-height: 1.5; color:#111;">
  <h2 style="margin:0 0 12px 0;">Підтверди email</h2>
  <p style="margin:0 0 16px 0;">
    Привіт, <b>{{ username }}</b>! Натисни кнопку нижче, щоб підтвердити email для входу в EarthCity.
  </p>
  <p style="margin:0 0 18px 0;">
    <a href="{{ link }}"
       style="display:inline-block; padding:12px 16px; background:#111827; color:#fff;
              text-decoration:none; border-radius:12px;">
      ✅ Підтвердити email
    </a>
  </p>
  <p style="margin:0; color:#555; font-size:13px;">
    Якщо ти не реєструвався — просто ігноруй цей лист.
  </p>
  <hr style="border:none; border-top:1px solid #eee; margin:18px 0;">
  <p style="margin:0; color:#888; font-size:12px;">Лінк дійсний 24 години.</p>
</div>
