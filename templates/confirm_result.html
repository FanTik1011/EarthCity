<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Email confirmation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:Inter,system-ui;
      background:#0b1020;
      color:#fff;
      padding:20px;
    }
    .card{
      max-width:520px;
      width:100%;
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:18px;
      background:rgba(255,255,255,.06);
      text-align:center;
    }
    .ok{color:#22c55e;font-weight:800}
    .bad{color:#ef4444;font-weight:800}
    .countdown{
      margin-top:12px;
      font-size:13px;
      opacity:.75;
    }
  </style>
</head>

<body>
  <div class="card">
    <div style="font-size:18px;font-weight:800;margin-bottom:8px;">
      {% if ok %}
        <span class="ok">✅ Email підтверджено</span>
      {% else %}
        <span class="bad">❌ Помилка</span>
      {% endif %}
    </div>

    <div style="opacity:.9;">{{ msg }}</div>

    <div class="countdown">
      Переадресація на карту через <span id="sec">3</span>…
    </div>
  </div>

  <script>
    let s = 3;
    const el = document.getElementById("sec");

    const t = setInterval(() => {
      s--;
      if (el) el.textContent = s;
      if (s <= 0) {
        clearInterval(t);
        window.location.href = "/";
      }
    }, 1000);
  </script>
</body>
</html>
